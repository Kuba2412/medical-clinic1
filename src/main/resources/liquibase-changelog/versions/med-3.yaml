databaseChangeLog:
  - changeSet:
      id: 3
      author: Kuba
      changes:
        - createTable:
            tableName: VISIT
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_visit_id
                    nullable: false
              - column:
                  name: start_visit
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_visit
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: VISIT
            baseColumnNames: patient_id
            constraintName: fk_visit_patient
            referencedTableName: PATIENT
            referencedColumnNames: id
            onDelete: CASCADE
