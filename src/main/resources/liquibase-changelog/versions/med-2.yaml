databaseChangeLog:
  - changeSet:
      id: 2
      author: Kuba
      changes:
        - createTable:
            tableName: USERS
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users_id
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: PATIENT
            baseColumnNames: user_id
            constraintName: fk_patient_user
            referencedTableName: USERS
            referencedColumnNames: id
            onDelete: CASCADE

